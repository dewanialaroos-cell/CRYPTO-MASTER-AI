name: Crypto Master AI Historical News Data
on:
  workflow_dispatch:
  push:
    paths:
      - "download_historical_news.py"
      - ".github/workflows/download_historical_news.yml"
permissions:
  contents: write
concurrency:
  group: crypto-master-ai-historical-news
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Download real historical news and label with later prices
        run: python download_historical_news.py
      - name: Upload news data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-historical-news
          path: |
            specialist_data/news/
            data_downloads/news_download_summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit available datasets and report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_data/news data_downloads/news_download_summary.json
          if git diff --cached --quiet; then echo "No new news data"; else git commit -m "Add labeled historical crypto news datasets"; git pull --rebase origin main; git push; fi