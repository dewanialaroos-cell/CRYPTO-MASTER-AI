name: Crypto Master AI V7 Individual Specialist Backtests
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v7_specialists.py'
      - 'train_ai_v7_specialists.py'
      - '.github/workflows/backtest_v7_specialists.yml'
      - 'models/crypto_master_ai_v7_report.json'
permissions:
  contents: write
concurrency:
  group: crypto-master-ai-v7-backtests
  cancel-in-progress: false
jobs:
  v7-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile V7 backtester
        run: python -m py_compile backtest_v7_specialists.py
      - name: Train V7 specialists to recreate the model artifact
        run: python train_ai_v7_specialists.py
      - name: Run individual V7 specialist backtests
        run: python backtest_v7_specialists.py
      - name: Upload V7 reports and trade log
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-v7-individual-backtests
          path: |
            models/backtest_v7_specialists_report.json
            models/backtest_v7_specialists_trades.csv
          if-no-files-found: error
          retention-days: 30
      - name: Commit V7 backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/backtest_v7_specialists_report.json models/backtest_v7_specialists_trades.csv
          if git diff --cached --quiet; then
            echo "No V7 backtest report changes."
          else
            git commit -m "Add individual V7 specialist trading backtests"
            # Stash generated model/report changes left by the training step.
            git stash push --include-untracked -m "temporary generated model artifacts"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
