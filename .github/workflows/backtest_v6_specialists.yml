name: Crypto Master AI Independent Specialist Backtests
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v6_specialists.py'
      - '.github/workflows/backtest_v6_specialists.yml'
permissions:
  contents: write
concurrency:
  group: crypto-master-ai-independent-specialist-backtests
  cancel-in-progress: false
jobs:
  specialist-backtests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile V6 trainer and specialist backtester
        run: python -m py_compile train_ai_v6.py backtest_v6_specialists.py train_ai_v3.py
      - name: Train V6 specialists on available OHLCV data
        run: python train_ai_v6.py
      - name: Run independent backtest for every V6 specialist
        run: python backtest_v6_specialists.py
      - name: Upload individual specialist backtest results
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-independent-specialist-backtests
          path: |
            models/backtest_v6_specialists_report.json
            models/backtest_v6_specialists_trades.csv
          if-no-files-found: error
          retention-days: 30
      - name: Commit specialist backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/backtest_v6_specialists_report.json models/backtest_v6_specialists_trades.csv
          if git diff --cached --quiet; then
            echo "No specialist backtest changes."
          else
            git commit -m "Add independent V6 specialist backtest results"
            git pull --rebase origin main
            git push
          fi
