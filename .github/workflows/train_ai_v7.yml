name: Crypto Master AI V7 External Domain Specialists
on:
  workflow_dispatch:
  push:
    paths:
      - 'train_ai_v7_specialists.py'
      - '.github/workflows/train_ai_v7.yml'
      - 'specialist_data/**'
permissions:
  contents: write
concurrency:
  group: crypto-master-ai-data-commit-queue
  cancel-in-progress: false
jobs:
  train-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile V7 trainer
        run: python -m py_compile train_ai_v7_specialists.py
      - name: Train available domain specialists
        run: python train_ai_v7_specialists.py
      - name: Upload V7 models and readiness report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-v7-domain-specialists
          path: |
            models/crypto_master_ai_v7_specialists.joblib
            models/crypto_master_ai_v7_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit V7 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/crypto_master_ai_v7_report.json || true
          if git diff --cached --quiet; then
            echo "No V7 report changes to commit."
          else
            git commit -m "Add V7 domain specialist readiness report"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" -eq 3 ]; then echo "Push failed after retries"; exit 1; fi
              sleep 2
            done
          fi
