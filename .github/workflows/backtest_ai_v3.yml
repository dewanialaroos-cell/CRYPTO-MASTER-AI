name: Crypto Master AI V3 Head Backtest
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Probability threshold for LONG/SHORT (0.50-1.00)"
        required: true
        default: "0.60"
      fee_pct:
        description: "Fee per side in percent"
        required: true
        default: "0.04"
      slippage_pct:
        description: "Slippage per side in percent"
        required: true
        default: "0.02"
permissions:
  contents: write
concurrency:
  group: crypto-master-ai-v3-backtest
  cancel-in-progress: false
jobs:
  backtest-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backtest
        run: python -m py_compile backtest_ai_v3.py train_ai_v3.py
      - name: Verify trained model exists
        run: test -f models/crypto_ai_model_v3.joblib
      - name: Run backtest
        run: |
          python backtest_ai_v3.py \
            --threshold "\${{ inputs.threshold }}" \
            --fee-pct "\${{ inputs.fee_pct }}" \
            --slippage-pct "\${{ inputs.slippage_pct }}"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-v3-backtest
          path: |
            models/backtest_ai_v3_report.json
            models/backtest_ai_v3_trades.csv
          if-no-files-found: error
          retention-days: 30
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/backtest_ai_v3_report.json models/backtest_ai_v3_trades.csv
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
          else
            git commit -m "Add V3 Head AI backtest results"
            git push
          fi
