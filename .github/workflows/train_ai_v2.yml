name: Crypto Master AI V2 Training

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: crypto-master-ai-v2-training
  cancel-in-progress: false

jobs:
  train-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile trainer
        run: python -m py_compile train_ai_v2.py

      - name: Train and evaluate V2
        run: python train_ai_v2.py

      - name: Upload model and report as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-v2-model-and-report
          path: |
            models/crypto_ai_model_v2.joblib
            models/ai_training_report_v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit V2 model and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/crypto_ai_model_v2.joblib models/ai_training_report_v2.json
          if git diff --cached --quiet; then
            echo "No model/report changes to commit."
          else
            git commit -m "Train Crypto Master AI V2 model"
            git push
          fi
