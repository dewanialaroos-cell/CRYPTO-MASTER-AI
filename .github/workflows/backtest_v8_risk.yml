name: Crypto Master AI V8 Risk-Controlled Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v8_risk.py'
      - '.github/workflows/backtest_v8_risk.yml'
permissions:
  contents: write
concurrency:
  group: crypto-master-ai-v8-risk-backtest
  cancel-in-progress: false
jobs:
  v8-risk-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile V8 risk backtester
        run: python -m py_compile backtest_v8_risk.py train_ai_v7_specialists.py
      - name: Train V7 specialists with leakage exclusions
        run: python train_ai_v7_specialists.py
      - name: Run V8 risk-controlled backtest
        run: python backtest_v8_risk.py
      - name: Upload V8 report and trades
        uses: actions/upload-artifact@v4
        with:
          name: crypto-master-ai-v8-risk-backtest
          path: |
            models/backtest_v8_risk_report.json
            models/backtest_v8_risk_trades.csv
          if-no-files-found: error
          retention-days: 30
      - name: Commit V8 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/backtest_v8_risk_report.json models/backtest_v8_risk_trades.csv
          if git diff --cached --quiet; then
            echo "No V8 report changes."
          else
            git commit -m "Add V8 risk-controlled specialist backtest results"
            git stash push --include-untracked -m "temporary generated training artifacts"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
